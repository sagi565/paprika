# Render blueprint for the API (FastAPI). The database is on Neon; the frontend on Netlify.
services:
  - type: web
    name: paprika-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL # Neon connection string, entered in the Render dashboard
        sync: false
      - key: ADMIN_PASSWORD # the site's login password, entered in the Render dashboard
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: SEED_DEMO
        value: "false"
      - key: PUBLIC_URL # the Netlify address, e.g. https://paprika-fruits.netlify.app
        sync: false
      # Grow sandbox until Grow's go-live review passes; then secure.meshulam.co.il with the
      # production userId/pageCode Grow sends. Charges run only from the "charge" buttons.
      - key: GROW_MODE
        value: live
      - key: GROW_BASE_URL
        value: https://sandbox.meshulam.co.il/api/light/server/1.0
      - key: GROW_USER_ID # from Grow, entered in the Render dashboard
        sync: false
      - key: GROW_PAGE_CODE # the token page code from Grow, entered in the Render dashboard
        sync: false
      - key: GROW_WEBHOOK_KEY
        generateValue: true
